# This stack is wrapped by Pulumi's passphrase provider, and neither the
# provider line nor the `encryptionsalt` it writes is committed here. The salt
# is an offline verifier for the passphrase -- whoever holds it can test
# candidates at their own rate, with no state backend and no cloud IAM in the
# loop -- and this repo is public. `branchLeft/standards` clause PUL-12 bans a
# committed salt outright, in every mode.
#
# CI appends it on the runner from the `PULUMI_SALT_BLOG` repository secret,
# before any pulumi command, and never commits the result. To apply by hand,
# append your own held copy to the working file and do not commit it:
#
#     printf '\nencryptionsalt: %s\n' "$PULUMI_SALT_BLOG" >> Pulumi.blog.yaml
#
# Earlier revisions of this file carry a KMS `encryptedkey` rather than a salt,
# so no passphrase verifier has ever been published here.
config:
  gcp:project: branchleft-prod
  blog-infra:tenantName: blog
  blog-infra:siteUrl: https://blog.branchleft.co.uk
  blog-infra:imageDigestOrTag: sha256:cd90f86474c1d5266bb81e5511abbc5de36b8c8fa4d14adc971dc9e9a8eb7920
  blog-infra:deployerServiceAccountEmail: blog-deployer@branchleft-prod.iam.gserviceaccount.com
  blog-infra:platformDbInstanceConnectionName: branchleft-prod:europe-west1:ghost-platform-db
  blog-infra:platformTenantImageRepositoryDockerPath: europe-west1-docker.pkg.dev/branchleft-prod/ghost-platform-tenant
  blog-infra:platformMediaBucketUrl: gs://branchleft-prod-ghost-platform-media
  blog-infra:mailHost: mx1.branchleft.co.uk
  blog-infra:mailPort: '587'
  blog-infra:mailUser: blog@branchleft.co.uk
  blog-infra:mailFrom: 'branchLeft blog <blog@branchleft.co.uk>'
  # mailSmtpPassword is not committed here. It is a live credential, and this
  # is a public repo, so it is held as an Actions secret and encrypted into
  # this stack's config by the deploy job at runtime, before any program run
  # reads it -- see .github/workflows/infra-ci.yml.
  blog-infra:bulkEmailBaseUrl: https://mx1.branchleft.co.uk:8443
  blog-infra:bulkEmailDomain: blog.branchleft.co.uk
  # bulkEmailApiKey is injected at deploy time too, for the same reason as
  # mailSmtpPassword above.
