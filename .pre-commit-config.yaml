# The hooks every repo runs, whatever it is written in. A repo appends its own
# below — formatter, linter, test runner, shellcheck — and SYNC-1 only asserts
# that these survive.
#
# The version is pinned rather than floating because a hook set that changes
# under you rewrites files in a commit nobody reviewed.
exclude: ^graphify-out/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # Stated rather than inherited: the hook's own default has moved before,
      # and this threshold is meant to be the same number in every repo.
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: local
    hooks:
      # `pass_filenames: false` with an explicit ignore path rather than letting
      # pre-commit hand it a file list: the second --ignore-path only resolves
      # from the repo root, so a hook invoked with paths would reformat vendor/.
      - id: prettier
        name: prettier
        entry: npm run format --silent
        language: system
        files: \.(ts|md|ya?ml|json)$
        pass_filenames: false

      - id: typecheck
        name: typecheck
        entry: npm run typecheck --silent
        language: system
        files: \.ts$
        pass_filenames: false

      # Stdlib unittest, so there is nothing to install. It also exercises the
      # committed-secret guard's own `--self-test`, which is why that one has
      # no hook of its own -- CI still invokes it directly, because CI runs the
      # script rather than the test runner.
      - id: scripts-tests
        name: scripts unit tests
        entry: sh -c "python3 -m unittest discover -s scripts -p 'test_*.py'"
        language: system
        files: ^scripts/.*\.py$
        pass_filenames: false

      # The salt is an offline verifier for this stack's passphrase and is
      # never committed. Pulumi writes one back into the config file during an
      # ordinary `pulumi config set`, where the diff looks like exactly what
      # the command was asked to do, so this has to be mechanical rather than a
      # rule people follow.
      - id: no-committed-pulumi-secrets
        name: no encryptionsalt in a committed stack config
        entry: python3 scripts/assert-no-committed-pulumi-secrets.py
        language: system
        files: ^(.*/)?Pulumi\.[^/]+\.yaml$
