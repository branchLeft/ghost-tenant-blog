name: Infra CI

# Type-checks this repo's Pulumi program on every PR, and on every push to main
# previews its one stack (the `plan` job, before any approval), then applies it
# and deploys the pinned image to this tenant's Compose slot on its app host
# (the `deploy` job, behind the `production` approval gate, which also waits
# for the plan job to succeed). A push whose plan changes nothing and whose
# pinned image is the one last deployed skips the deploy job, and so its
# approval, with the reason on the first line of the plan job's summary.
#
# WHAT THIS STACK IS. The `GhostTenant` component declares no cloud resources.
# Everything durable a tenant uses already exists and is shared -- the app host,
# `db1`, the Object Storage bucket -- so what is per-tenant is *configuration*,
# and this stack is the versioned, reviewed, passphrase-wrapped record of it.
# `pulumi up` therefore renders rather than creates: its useful products are the
# `composeFile` and `secretsEnvFile` outputs an operator places on the host.
#
# WHAT DEPLOYS. Only the image. `branchleft-deploy` on the app host writes
# /etc/branchleft/<slug>.image.env and restarts branchleft-compose@<slug>; it
# never writes the secrets file and never rewrites the Compose file, both of
# which are root-owned and operator-written. So a compromised copy of this
# repo's credentials can change which image this tenant runs and nothing else on
# that host -- see the reach table in the platform's migration programme doc.
#
# CREDENTIALS. Every credential this workflow holds is an **environment**
# secret on `production`, never a repository secret. A repository secret is
# readable by any workflow run in this repo, including one from a branch; an
# environment secret is readable only by a job that declares that environment,
# which is only the deploy job below (and, for the four state and passphrase
# secrets alone, the plan job, on its own `production-plan` environment, which
# only the branch main can use). On a public repo the environment also
# carries a required-reviewer rule. On a private one it cannot (that is a plan
# tier limit, not a configuration mistake), and the scoping above is then the
# whole of what the environment buys -- which is still the property that matters
# here.
#
#   APP_HOST_DEPLOY_KEY   this tenant's own ed25519 private key. Never shared
#                         with another tenant and never reused across hosts.
#                         Its authorized_keys entry on the host carries a forced
#                         command naming this stack, written by root, so the key
#                         cannot address any other stack: there is no
#                         caller-supplied stack name anywhere on the path.
#   PULUMI_CONFIG_PASSPHRASE  this stack's own secrets passphrase, minted at
#                         onboarding, never shared with another tenant or with
#                         the platform repo that created it.
#   PULUMI_ENCRYPTION_SALT    this stack's `encryptionsalt`, held as a secret
#                         rather than committed beside the ciphertexts it
#                         unwraps (branchLeft/standards PUL-12). A salt in a tree
#                         anyone can clone is an offline verifier for the
#                         passphrase above.
#   HETZNER_S3_ACCESS_KEY_ID / HETZNER_S3_SECRET_ACCESS_KEY
#                         reach the Pulumi state backend. Not scoped per stack:
#                         they reach every tenant stack in that bucket, which is
#                         why that bucket holds tenant stacks alone and never the
#                         estate's own.
#
# No GCP identity, no Workload Identity Federation, no service account. The
# provider-enforced repository pin those gave is not replaced like for like; the
# environment scoping above is the replacement.
#
# `pnpm install --frozen-lockfile` authenticates with the run's own
# GITHUB_TOKEN. @branchleft/ghost-platform-tenant is a public package, and any
# authenticated token can read one, so a tenant repo holds no long-lived
# package credential. GitHub Packages' npm registry still rejects anonymous
# requests, which is why a token is needed at all.
#
# Both checkout steps set `persist-credentials: false` regardless: without it,
# the token GitHub issues for checkout would sit on disk for every later step in
# the job -- including `pnpm install`'s transitive postinstall scripts -- to
# read.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npx tsc --noEmit

      # The pre-commit hook runs `prettier --write .`, covering YAML and JSON
      # as well as TS/JS (LINT-4). This is the read-only half of that pair:
      # without it, a file a contributor forgot to run pre-commit on merges
      # unformatted and nothing here catches it.
      - name: Check formatting
        run: npx prettier --check . --ignore-path .gitignore --ignore-path .prettierignore --ignore-path node_modules/@branchleft/prettier-config/prettierignore

      # Skipped in the template repo itself, where an unsubstituted placeholder
      # is the correct, permanent state of `main` -- this step exists for repos
      # generated *from* the template. `!= true` (not `== false`) so an
      # absent/null `is_template` fails open into running the check, not
      # skipping it.
      - name: Verify template placeholders are substituted
        if: github.event.repository.is_template != true
        run: python3 scripts/assert-placeholders-substituted.py

      # Unconditional -- unlike the step above, this one is never skipped in
      # this repo itself. Prettier's bold-emphasis rewrite of a placeholder
      # (see .prettierignore's comment for the concrete example) is a bug in
      # the template, where it means substitution will find nothing to
      # replace, and in a repo already generated from it, where it means that
      # already happened.
      - name: Verify no template placeholder was mangled
        run: python3 scripts/assert-placeholders-substituted.py --mangled

      # The inverse of "Verify template placeholders are substituted" above:
      # only meaningful here, in the template, where a placeholder present and
      # intact is the correct, permanent state of `main` -- not in a generated
      # repo, where the same fact would be exactly the bug that step exists to
      # catch.
      - name: Verify the template still carries every placeholder, intact
        if: github.event.repository.is_template == true
        run: python3 scripts/assert-placeholders-substituted.py --template

      # The guard ships inside the component now, rather than being a copy in
      # this repo that has to be kept in step with a component it does not
      # travel with. `--verify-coverage` takes the package ROOT: the script
      # looks for `dist/index.js` beneath what it is given, so pointing it at
      # `dist` asks for `dist/dist/index.js` and it reports a missing tree
      # rather than a coverage result.
      #
      # Cheap, credential-free, and it catches the way the deploy job's safety
      # gates die quietly -- so the pull request that introduces the drift
      # fails, rather than the merge that ships it.
      - name: Verify the delete-guard still covers every protected field
        run: |
          GUARD=node_modules/@branchleft/ghost-platform-tenant/scripts/assert-no-tenant-deletes.py
          python3 "$GUARD" --self-test
          python3 "$GUARD" --verify-coverage node_modules/@branchleft/ghost-platform-tenant

      # Run here as well as in the credential-free `secret-guard` job, and the
      # duplication is the point: one assertion in
      # `test_generate_tenant_repo.py` compares this repo's copy of the reserved
      # stack names against the installed component's, and skips itself when the
      # package is absent. `secret-guard` deliberately installs nothing, so
      # without this step that assertion would be permanently skipped and a
      # drifted copy would fail open.
      - name: Script unit tests, against the installed component
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # Its own job. What makes a committed salt dangerous is publication: one
  # already on `main` is already in every clone, so the merge is the gate that
  # matters. This check has to be in the branch ruleset to have any teeth -- see
  # README.md. `plan` and `deploy` both list `secret-guard` in `needs`, so a
  # committed salt stops both before any credential is used. In a generated
  # repo with no branch ruleset, that job graph is the only enforcement.
  secret-guard:
    name: Committed-secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stdlib unittest, no runner to install and nothing from npm -- this job
      # holds no credential and needs none.
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # `--scan-tree` rather than a changed-file list: a salt that arrived on a
      # branch nobody checked has to fail here rather than at publication, and a
      # hook pattern that silently stops matching is a hook that passes
      # everything.
      - name: Refuse a committed encryption salt
        run: |
          python3 scripts/assert-no-committed-pulumi-secrets.py --self-test
          python3 scripts/assert-no-committed-pulumi-secrets.py --scan-tree .

      # Every tracked markdown file, not a fixed list -- a runbook added
      # later is covered without this workflow needing an edit. Catches an
      # `export CREDENTIAL=<placeholder>` or `printf`-into-a-credential-field
      # paste-and-run instruction in either placeholder shape this estate has
      # actually shipped, `<...>` and the Unicode ellipsis (`…`).
      - name: Refuse an inline credential in a runbook
        run: python3 scripts/assert-no-inline-credential.py $(git ls-files '*.md')

      # The no-op deploy gate's wiring, checked from the shared action pinned by
      # commit. It reads this workflow file only, holds no credential, and runs
      # on every pull request, so a broken gate fails before it can merge.
      - name: Check the no-op deploy gate's wiring
        uses: branchLeft/github-workflows/.github/actions/check-apply-gate@ea6de91ba90ed9a3a988ae8ffa0e9d70dd42f691 # v1.0.19
        with:
          workflow: .github/workflows/infra-ci.yml
          pairs: plan:deploy
          verdict-step: noop
          plan-file: preview-plan.json

  # The plan, made BEFORE the deploy job below waits for its approval, so that
  # whoever approves (the owner, or the deploy-approval App on the owner's
  # behalf) can read what the apply would do instead of approving blind. The
  # deploy job still previews and checks again after approval, because state
  # can move while a run waits; this job is the copy that exists in time.
  #
  # It cannot run on a pull request. A preview reads the state backend and
  # decrypts the stack's secrets, so it needs the state credentials, the
  # passphrase and the salt, and none of those may be readable from a branch.
  # So it runs on main only, after the merge and before the gate. That is
  # after the code is merged, not before: the gate is still the last stop, and
  # a pull request is still checked by `typecheck`.
  #
  # CREDENTIALS. The same four secret names `deploy` reads (never
  # APP_HOST_DEPLOY_KEY, which stays on `production` alone), held as
  # environment secrets on a SECOND environment, `production-plan`. It carries
  # no reviewer, because a reviewer rule on it would stop this job before the
  # plan exists, which is the thing it is here to avoid. What stands in for a
  # reviewer is a deployment branch policy naming `main` alone, which the first
  # step enforces: without it any branch could declare this environment and
  # read the state credentials. This job holds no host key, runs no `pulumi up`
  # and writes nothing to the state, so what it adds to the reach of those
  # secrets is a read of the plan. See README.md, "Repo variables and
  # environment secrets".
  #
  # THE LINE THE APPROVER READS. `summarise-plan.py` prints one line with the
  # plan's per-kind step counts, in the shape the deploy-approval script parses
  # out of this job's log. No `run` body in this job may spell that marker out:
  # the runner echoes a `run` body into the log, and the script wants exactly
  # one line carrying it.
  plan:
    name: Plan (tenant, pulumi preview)
    runs-on: ubuntu-latest
    needs: [typecheck, secret-guard]
    timeout-minutes: 15

    # The one value the deploy job reads from this job, written by the last
    # step below and by no other. Only the string 'false' lets the deploy job be
    # skipped; see the deploy job's `if:` and the last step's comment.
    outputs:
      has_changes: ${{ steps.noop.outputs.has_changes }}

    # The deploy job's condition without its last operand (the has_changes
    # test), so the two are created together or not at all, and the deploy job
    # can wait on this one. A test holds the two to that.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.is_template != true

    environment: production-plan

    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify template placeholders are substituted
        run: python3 scripts/assert-placeholders-substituted.py

      - name: Verify no template placeholder was mangled
        run: python3 scripts/assert-placeholders-substituted.py --mangled

      # Before anything reads a secret. An environment with no branch policy
      # hands its secrets to a job from any branch, and says nothing. Any failed
      # or malformed read refuses.
      - name: Refuse a plan environment that any branch can use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          env_json=$(mktemp)
          policies_json=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/environments/production-plan" > "$env_json" \
            || { echo "::error::could not read the production-plan environment" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/environments/production-plan/deployment-branch-policies" > "$policies_json" \
            || { echo "::error::could not read the production-plan deployment branch policies" >&2; exit 1; }
          python3 scripts/assert-plan-environment-main-only.py --self-test > /dev/null
          if ! python3 scripts/assert-plan-environment-main-only.py "$env_json" "$policies_json"; then
            echo "::error::the production-plan environment is not limited to the branch main, so a job from any branch could read its secrets. Set its deployment branch policy to main alone in repo settings first." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # The next four steps are the deploy job's own, word for word, and a test
      # holds them to it (scripts/test_plan_job.py): a plan made with a
      # different login or salt than the apply would be a plan of something
      # else. The reasons are written out once, in the deploy job.
      - name: Confirm this stack's secrets passphrase is set
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          if [ -z "${PULUMI_CONFIG_PASSPHRASE//[[:space:]]/}" ]; then
            echo "::error::PULUMI_CONFIG_PASSPHRASE is empty, whitespace-only or unset on this repository's production environment. Refusing to continue: Pulumi would treat an empty value as a valid passphrase rather than failing closed."
            exit 1
          fi

      - name: Log in to the Pulumi state backend
        env:
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${PULUMI_BACKEND_URL//[[:space:]]/}" ]; then
            echo "::error::the PULUMI_BACKEND_URL repository variable is empty, whitespace-only or unset"
            exit 1
          fi
          case "$PULUMI_BACKEND_URL" in
            s3://*) ;;
            *)
              echo "::error::PULUMI_BACKEND_URL must be an s3:// backend. A gs:// backend would give this tenant a GCP dependency, which the Hetzner migration exists to remove."
              exit 1
              ;;
          esac
          if [ -z "${AWS_ACCESS_KEY_ID//[[:space:]]/}" ] || [ -z "${AWS_SECRET_ACCESS_KEY//[[:space:]]/}" ]; then
            echo "::error::HETZNER_S3_ACCESS_KEY_ID / HETZNER_S3_SECRET_ACCESS_KEY are empty, whitespace-only or unset on this repository's production environment; the state backend is unreachable without them."
            exit 1
          fi
          pulumi login "$PULUMI_BACKEND_URL"

      - name: Restore the stack's encryption salt
        env:
          PULUMI_ENCRYPTION_SALT: ${{ secrets.PULUMI_ENCRYPTION_SALT }}
        run: |
          config=Pulumi.blog.yaml
          if [ ! -f "$config" ]; then
            echo "::error::$config is missing. The provisioning flow commits this stack's config, and without it there is nothing for this job to deploy."
            exit 1
          fi
          salt_status=0
          salt_report=$(python3 scripts/assert-no-committed-pulumi-secrets.py "$config" 2>&1) || salt_status=$?
          if [ "$salt_status" -eq 1 ]; then
            echo "::warning::$config already carries an encryptionsalt, so none was restored and this stack still decrypts with the committed value. Move that value into the PULUMI_ENCRYPTION_SALT environment secret and delete the line from the file; the Committed-secret guard job fails while it is there."
            exit 0
          fi
          if [ "$salt_status" -ne 0 ]; then
            printf '%s\n' "$salt_report"
            echo "::error::scripts/assert-no-committed-pulumi-secrets.py exited $salt_status. That is neither 'no salt committed' (0) nor 'a salt is committed' (1), so whether $config carries one is unknown and this refuses to guess. The output above is the script's own."
            exit 1
          fi
          if [ -z "${PULUMI_ENCRYPTION_SALT//[[:space:]]/}" ]; then
            echo "::error::the PULUMI_ENCRYPTION_SALT environment secret is empty, whitespace-only or unset, and $config carries no salt of its own. Set the secret to this stack's encryption salt before deploying."
            exit 1
          fi
          case "$PULUMI_ENCRYPTION_SALT" in
            v1:*) ;;
            *)
              echo "::error::the PULUMI_ENCRYPTION_SALT environment secret does not look like a Pulumi-generated salt (expected a 'v1:' prefix). Set it to the value alone, without the 'encryptionsalt: ' key in front of it."
              exit 1
              ;;
          esac
          printf '\nencryptionsalt: %s\n' "$PULUMI_ENCRYPTION_SALT" >> "$config"

      # `--show-sames` for the reason given on the deploy job's preview.
      - name: Preview the plan
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        run: pulumi preview --stack blog --json --show-sames > preview.json

      # The component's own guard, as on the deploy job. A plan that fails it
      # fails this job, which the deploy job waits on, so nothing reaches the
      # approval gate.
      - name: Refuse to apply a plan carrying a delete or replace
        run: |
          set -euo pipefail
          GUARD=node_modules/@branchleft/ghost-platform-tenant/scripts/assert-no-tenant-deletes.py
          python3 "$GUARD" --self-test
          python3 "$GUARD" --verify-coverage node_modules/@branchleft/ghost-platform-tenant
          python3 "$GUARD" preview.json

      # What the approver reads. Resource type and name per step, never a
      # property value: this stack's outputs include a Pulumi secret, and on a
      # public tenant repo a log is public. The script refuses a delete or a
      # replace again for itself and fails closed on a plan it cannot read.
      - name: Print the plan
        run: |
          python3 scripts/summarise-plan.py --self-test > /dev/null
          python3 scripts/summarise-plan.py preview.json

      # The update plan is saved by a second preview, apart from the one above,
      # so the preview.json the delete guard and the approver read is produced
      # exactly as before. Best effort, and the only step in this job that is:
      # a failure leaves no plan file, which the parser below reads as
      # "changes", so the deploy job is asked for as before. The plan file can
      # hold resource inputs and secrets-provider ciphertext, and is never
      # uploaded, printed or summarised.
      - name: Save the update plan for the no-change check
        continue-on-error: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        run: pulumi preview --stack blog --save-plan preview-plan.json > /dev/null

      # The Pulumi half of "would the deploy change anything", from the shared
      # action pinned by commit. It writes its headline to a file and not to the
      # job summary: the combining step below is the only writer of either,
      # because this job's deploy delivers more than the plan shows. Fails
      # closed: `has_changes` is `false` only for a plan that parsed and changes
      # nothing, outputs included.
      - name: Decide whether the plan changes anything
        id: plan
        if: always()
        uses: branchLeft/github-workflows/.github/actions/plan-has-changes@ea6de91ba90ed9a3a988ae8ffa0e9d70dd42f691 # v1.0.19
        with:
          preview-json: preview.json
          plan-file: preview-plan.json
          working-directory: .
          write-summary: 'false'

      # The other half. The deploy job also puts the pinned image on the app
      # host over SSH, and a push that changes only the image shows a Pulumi plan
      # of nothing but `same`. So the image this commit pins is compared with the
      # one the last successful run of this workflow on main shipped, read from
      # the run history with this job's own read-only token: no host key, no new
      # scope. image-changed.md has the rules; anything it cannot establish is
      # `image_changed=true`.
      - name: Check the pinned image against the last deployed one
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/image-changed.py --workflow infra-ci.yml --config Pulumi.blog.yaml --github-output "$RUNNER_TEMP/image-verdict.out"

      # The only step that writes `has_changes`, and the only one that writes
      # this job's summary. Both halves must say "no change" for it to be
      # `false`; a missing or unreadable verdict file reads as `true`, so every
      # other outcome asks for the approval as before. The first line of the
      # summary says which way it went and why.
      - name: Decide whether the deploy is needed
        id: noop
        if: always()
        env:
          PLAN_HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
          PLAN_SUMMARY_FILE: ${{ steps.plan.outputs.summary_file }}
        run: |
          set -eu
          image_says=$(sed -n 1p "$RUNNER_TEMP/image-verdict.out" 2>/dev/null) || image_says=
          image_reason=$(sed -n 2p "$RUNNER_TEMP/image-verdict.out" 2>/dev/null | grep -Ex 'reason=[a-z-]+') || image_reason='reason=unreadable'
          if [ "$PLAN_HAS_CHANGES" = "false" ] && [ "$image_says" = "image_changed=false" ]; then
            has_changes=false
            headline='No changes: the deploy job is skipped and no approval is requested (a clean plan, and the pinned image is the one last deployed).'
          else
            has_changes=true
            if [ "$image_says" = "image_changed=false" ]; then
              headline='Approval required: the plan changes something, or could not be read as clean.'
            elif [ "$PLAN_HAS_CHANGES" = "false" ]; then
              headline='Approval required: the pinned image is not shown to be the one last deployed.'
            else
              headline='Approval required: the plan changes something or could not be read as clean, and the pinned image is not shown to be the one last deployed.'
            fi
          fi
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' "$headline"
            printf 'Image check: %s\n' "${image_reason#reason=}"
            if [ "$PLAN_HAS_CHANGES" != "false" ] && [ -f "$PLAN_SUMMARY_FILE" ]; then
              cat "$PLAN_SUMMARY_FILE"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [typecheck, secret-guard, plan]

    # Not a contradiction of `cancel-in-progress: false` below: that refuses a
    # cancel from a NEWER run, this bounds a run that has stopped progressing.
    # Waiting on the `production` environment's reviewer does not count toward
    # it, so this bounds execution time alone.
    #
    # If it fires mid-apply the stack lock survives, and every later deploy for
    # this tenant fails at preview until it is cleared by hand on the stack.
    timeout-minutes: 30

    # `!= true`, not `== false` -- see the type-check job's placeholder-guard
    # comment above for why an absent/null `is_template` must fail open into
    # running, not skipping.
    #
    # The last operand skips this job, and so its approval, only when the plan
    # job's verdict is exactly 'false': both a clean plan and a pinned image
    # equal to the last deployed one. An unset output asks, and so does every
    # verdict the plan job could not establish. This job delivers an image over
    # SSH as well as the Pulumi apply, so an image-only change is a change.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.is_template != true && needs.plan.outputs.has_changes != 'false'

    # Load-bearing, not a deployment-history label: every secret this job reads
    # is scoped to this environment, so no other job in this repo -- including
    # one added on a branch -- can read any of them. On a public repo it also
    # carries the required-reviewer rule. An environment carrying no protection
    # rule does not pause a run and does not say so: read `protection_rules`,
    # never the presence of this key.
    environment: production

    # Job-level permissions replace the workflow-level block entirely -- every
    # scope this job needs must be listed here. `id-token` is gone with WIF.
    permissions:
      contents: read
      packages: read

    # `cancel-in-progress: false` deliberately -- cancelling mid-flight leaves
    # the stack locked, or the host between an image pin and its restart.
    concurrency:
      group: deploy-blog
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First after checkout, which reads no environment secret and brings the
      # script. An environment with no rule pauses nothing and says nothing,
      # and a custom app's rule is listed only by the second read. Any failed
      # or malformed read refuses. Who approves is not decided here.
      - name: Refuse to deploy through an ungated environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          env_json=$(mktemp)
          rules_json=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/environments/production" > "$env_json" \
            || { echo "::error::could not read the production environment" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment_protection_rules" > "$rules_json" \
            || { echo "::error::could not read the production deployment protection rules" >&2; exit 1; }
          python3 scripts/assert-environment-gated.py --self-test > /dev/null
          if ! python3 scripts/assert-environment-gated.py "$env_json" "$rules_json"; then
            echo "::error::the production environment has neither a required-reviewer rule nor an enabled branchleft-reviewer deployment protection rule, so nothing would pause this deploy. Configure the gate in repo settings first." >&2
            exit 1
          fi

      # Ahead of every other step but the gate -- a literal `blog` must never
      # reach `pulumi preview` (it would select a stack that does not exist) let
      # alone `pulumi up`, and this check needs no dependencies and no
      # credentials to run.
      - name: Verify template placeholders are substituted
        run: python3 scripts/assert-placeholders-substituted.py

      # `--template` is not added here: this job's own `if:` already keeps it
      # from running in the template repo (see the comment above the job), so
      # the "placeholder must still be present" check would never see the one
      # context where that is the correct state -- only the mangled-form
      # check, meaningful in a generated repo too, belongs in this job.
      - name: Verify no template placeholder was mangled
        run: python3 scripts/assert-placeholders-substituted.py --mangled

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0

      # Pulumi's passphrase provider reads PULUMI_CONFIG_PASSPHRASE from the
      # environment via a plain lookup, which does not distinguish "unset" from
      # "set to an empty string" -- and GitHub expands a secret that does not
      # exist to `''`, not to an error. So a missing secret would not fail here
      # or later; it would try to unwrap this stack's data key with an empty
      # passphrase and fail with a message about the key, not about the secret.
      - name: Confirm this stack's secrets passphrase is set
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          if [ -z "${PULUMI_CONFIG_PASSPHRASE//[[:space:]]/}" ]; then
            echo "::error::PULUMI_CONFIG_PASSPHRASE is empty, whitespace-only or unset on this repository's production environment. Refusing to continue: Pulumi would treat an empty value as a valid passphrase rather than failing closed."
            exit 1
          fi

      # The full backend URL, not a bucket name: an s3:// backend needs the
      # endpoint, path-style and region query parameters too, and a repo holding
      # only the bucket would have to rebuild them -- with the endpoint host and
      # the region having to name the same location, or the failure is an opaque
      # 403 that reads as a credential problem.
      #
      # An unset repository variable resolves to an empty string with no error,
      # so `pulumi login` would otherwise fail somewhere downstream with a
      # message about the backend rather than about the variable.
      - name: Log in to the Pulumi state backend
        env:
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${PULUMI_BACKEND_URL//[[:space:]]/}" ]; then
            echo "::error::the PULUMI_BACKEND_URL repository variable is empty, whitespace-only or unset"
            exit 1
          fi
          case "$PULUMI_BACKEND_URL" in
            s3://*) ;;
            *)
              echo "::error::PULUMI_BACKEND_URL must be an s3:// backend. A gs:// backend would give this tenant a GCP dependency, which the Hetzner migration exists to remove."
              exit 1
              ;;
          esac
          if [ -z "${AWS_ACCESS_KEY_ID//[[:space:]]/}" ] || [ -z "${AWS_SECRET_ACCESS_KEY//[[:space:]]/}" ]; then
            echo "::error::HETZNER_S3_ACCESS_KEY_ID / HETZNER_S3_SECRET_ACCESS_KEY are empty, whitespace-only or unset on this repository's production environment; the state backend is unreachable without them."
            exit 1
          fi
          pulumi login "$PULUMI_BACKEND_URL"

      # The salt is not committed (branchLeft/standards PUL-12). It is appended
      # to the working copy here, for this job only, and never committed back.
      # Placed after the backend login and before `pulumi preview` -- the first
      # command that reads an encrypted value, not `up`.
      #
      # The value arrives through `env:` rather than as `${{ secrets.X }}` inside
      # `run`: an expression in `run` is substituted before the shell parses the
      # line, so a value carrying shell metacharacters would execute.
      #
      # It skips rather than appends when the config already carries a salt, and
      # asks the guard script rather than matching the key again here -- two
      # definitions of "a salt is committed" drift apart. Skipping is not
      # politeness: appending would leave a duplicate YAML mapping key, and the
      # two values would have to agree for the file to mean anything even where a
      # parser tolerated it.
      #
      # Fails closed on an empty value, naming the repository secret rather than
      # the passphrase: otherwise Pulumi reads a config whose salt line is blank,
      # reports this stack's secrets as corrupt, and sends whoever debugs it at
      # the passphrase. The `v1:` prefix is checked for the same reason.
      - name: Restore the stack's encryption salt
        env:
          PULUMI_ENCRYPTION_SALT: ${{ secrets.PULUMI_ENCRYPTION_SALT }}
        run: |
          config=Pulumi.blog.yaml
          if [ ! -f "$config" ]; then
            echo "::error::$config is missing. The provisioning flow commits this stack's config, and without it there is nothing for this job to deploy."
            exit 1
          fi
          # Captured rather than shown: on exit 1 the script's ::error::
          # annotations would mark a step that succeeded, and on any other status
          # they are the only evidence of what went wrong. `|| status=` keeps
          # `set -e` from aborting on the non-zero exit this expects.
          #
          # The script's exit status is three-valued: 0 clean, 1 a salt is
          # committed, 3 a named file could not be read. Only 1 may skip the
          # restore. A moved script, an absent interpreter, a config that is not
          # valid UTF-8 and argparse's own usage exit all land outside that, and
          # treating any of them as a committed salt would deploy with no salt at
          # all -- then send whoever reads the resulting decryption error at the
          # passphrase, which is the misdiagnosis these checks exist to prevent.
          salt_status=0
          salt_report=$(python3 scripts/assert-no-committed-pulumi-secrets.py "$config" 2>&1) || salt_status=$?
          if [ "$salt_status" -eq 1 ]; then
            echo "::warning::$config already carries an encryptionsalt, so none was restored and this stack still decrypts with the committed value. Move that value into the PULUMI_ENCRYPTION_SALT environment secret and delete the line from the file; the Committed-secret guard job fails while it is there."
            exit 0
          fi
          if [ "$salt_status" -ne 0 ]; then
            printf '%s\n' "$salt_report"
            echo "::error::scripts/assert-no-committed-pulumi-secrets.py exited $salt_status. That is neither 'no salt committed' (0) nor 'a salt is committed' (1), so whether $config carries one is unknown and this refuses to guess. The output above is the script's own."
            exit 1
          fi
          if [ -z "${PULUMI_ENCRYPTION_SALT//[[:space:]]/}" ]; then
            echo "::error::the PULUMI_ENCRYPTION_SALT environment secret is empty, whitespace-only or unset, and $config carries no salt of its own. Set the secret to this stack's encryption salt before deploying."
            exit 1
          fi
          case "$PULUMI_ENCRYPTION_SALT" in
            v1:*) ;;
            *)
              echo "::error::the PULUMI_ENCRYPTION_SALT environment secret does not look like a Pulumi-generated salt (expected a 'v1:' prefix). Set it to the value alone, without the 'encryptionsalt: ' key in front of it."
              exit 1
              ;;
          esac
          printf '\nencryptionsalt: %s\n' "$PULUMI_ENCRYPTION_SALT" >> "$config"

      - name: Preview the plan
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        # `--show-sames` is required by the guard, not a debugging aid. Pulumi
        # omits an unchanged ComponentResource from `steps` entirely without
        # it, which is indistinguishable from a `GhostTenant` that has stopped
        # registering its identity -- the exact ambiguity the component's
        # `component_is_present()` check exists to refuse. Every tenant change
        # that touches no identity field (media or mail config, `siteUrl`,
        # resource caps, an image digest bump) produces zero `GhostTenant`
        # steps, so without this flag the guard refuses those plans outright
        # once the pin reaches 3.0.0.
        run: pulumi preview --stack blog --json --show-sames > preview.json

      # `set -e` is load-bearing here, not boilerplate: the delete check is not
      # the last command in this script, and without errexit its non-zero exit
      # would be swallowed and the step's exit code would end up being the
      # self-test's. That shape is exactly how a guard reports green over a plan
      # that would have deleted a tenant's content volume.
      #
      # The full plan is NOT printed on failure, unlike the GCP-era version of
      # this step. This stack's outputs include `secretsEnvFile`, a Pulumi
      # secret: Pulumi renders it as `[secret]` in `--json`, and the difference
      # between relying on that and not printing the plan at all is one upstream
      # change. `pulumi preview --diff` from a checkout is the debugging path.
      # Both halves of this guard are live from component 3.0.0. The identity
      # half compares `uid`, `stackName`, `contentVolume`, `adaptersVolume`,
      # `databaseName` and `appHostPrivateIp` against the plan's own steps, so
      # a change to any of them is refused rather than applied as a clean
      # update. Under 2.0.0 it matched nothing: `GhostTenant` registered empty
      # inputs, so it produced no step for a preview to compare and a changed
      # `uid` reached `pulumi up` green.
      #
      # This is why the preview above must keep `--show-sames`. The 3.0.0 guard
      # refuses a plan carrying no step at all for the component, and Pulumi
      # omits an unchanged ComponentResource from `steps` without that flag --
      # which is indistinguishable from the component having stopped
      # registering its identity, and is the ambiguity the check exists to
      # refuse. Removing the flag breaks every tenant change that touches no
      # identity field.
      #
      # Expect one `update` step for the `GhostTenant` resource on the first
      # apply after this bump, with no configuration change. Its registered
      # inputs go from `{}` to the identity object; a ComponentResource has no
      # provider to call, so the step is inert and the guard passes it.
      - name: Refuse to apply a plan carrying a delete or replace
        run: |
          set -euo pipefail
          GUARD=node_modules/@branchleft/ghost-platform-tenant/scripts/assert-no-tenant-deletes.py
          python3 "$GUARD" --self-test
          python3 "$GUARD" --verify-coverage node_modules/@branchleft/ghost-platform-tenant
          python3 "$GUARD" preview.json

      - name: Apply
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        run: pulumi up --stack blog --yes

      # Read from this commit's own stack config, never from a stack output.
      # The apply above fails the job on a value the program rejects (the
      # digest-pin check in index.ts throws), so a value that reaches this step
      # is one that apply accepted. A stack output lives in the checkpoint, and
      # the state credential every tenant repository holds can rewrite it
      # between the apply and this read; what is read here becomes the image
      # pin on the host, so its source must be a file reviewed in this repo.
      - name: Read the image this stack pins
        id: image
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          image=$(pulumi config get imageRef --stack blog)
          # A failing command substitution inside a here-doc or an `echo` does
          # not trip errexit, so the value is captured and checked before it can
          # flow into an ssh invocation as an empty string.
          if [ -z "$image" ]; then
            echo "::error::the stack config value 'imageRef' is empty; refusing to deploy"
            exit 1
          fi
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      # The whole of this repo's reach on the app host. The key's authorized_keys
      # entry carries `restrict` and a forced command naming this tenant's stack,
      # written by root, so sshd executes exactly that whatever this step asks
      # for: the reference on stdin is the only thing this side supplies.
      #
      # `StrictHostKeyChecking=yes` against a committed `known_hosts`, never
      # `ssh-keyscan`: keyscan is trust-on-first-use, so a scan-then-connect
      # would hand this key to whatever answered.
      #
      # The key file is written with a restrictive umask rather than chmod'ed
      # afterwards -- ssh refuses a group-readable key, and the window between
      # create and chmod is one this can simply not have.
      - name: Deploy the pinned image to this tenant's slot
        env:
          DEPLOY_KEY: ${{ secrets.APP_HOST_DEPLOY_KEY }}
          APP_HOST_SSH_ADDRESS: ${{ vars.APP_HOST_SSH_ADDRESS }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY//[[:space:]]/}" ]; then
            echo "::error::APP_HOST_DEPLOY_KEY is empty, whitespace-only or unset on this repository's production environment. It is this tenant's own slot key, installed on the app host by an operator running provision_deploy_slot.py; see RUNBOOK-bootstrap.md."
            exit 1
          fi
          if [ -z "${APP_HOST_SSH_ADDRESS//[[:space:]]/}" ]; then
            echo "::error::the APP_HOST_SSH_ADDRESS repository variable is empty, whitespace-only or unset. It is the app host's PUBLIC address -- CI runs on GitHub-hosted runners and cannot reach the private one the stack binds its port to."
            exit 1
          fi
          # A file of comments is what the template ships, so "the file exists"
          # proves nothing. What matters is that it carries a key.
          if ! grep -qE '^[^#[:space:]]' known_hosts; then
            echo "::error::known_hosts carries no host key line. Fill it in from the host itself over an operator root session -- never with ssh-keyscan, which is trust-on-first-use and would defeat the pinning. The file's own header carries the command."
            exit 1
          fi
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > deploy_key
          printf '%s\n' "$IMAGE_REF" \
            | ssh -T -i deploy_key \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile=known_hosts \
                -o BatchMode=yes \
                "deploy@${APP_HOST_SSH_ADDRESS}"

      - name: Remove the deploy key from the runner
        if: always()
        run: rm -f deploy_key

      # Deliberately does not publish the preview plan, unlike the GCP-era
      # version of this workflow: this stack carries a secret output, and a job
      # summary on a public tenant repo is visible to anyone.
      - name: Write outcome to job summary
        if: always()
        # Bound rather than interpolated. Neither value is attacker-shaped, but a
        # `${{ }}` inside `run` is substituted before the shell parses the
        # script, and that property is worth being able to state without
        # exceptions.
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          {
            echo '## Tenant deploy'
            echo
            echo "Commit: \`${COMMIT_SHA}\`"
            echo "Image:  \`${IMAGE_REF:-not read - the run failed before the apply}\`"
            echo
            echo 'The stack renders configuration; only the image reference above'
            echo 'reached the host. `compose.yml` and `/etc/branchleft/<slug>.env`'
            echo 'are root-owned and operator-written, and no automated path'
            echo 'rewrites either.'
          } >> "$GITHUB_STEP_SUMMARY"
